name: Build Signed Release (AAB)

# Manual only: a release build is a deliberate action, not something that
# should happen on every push. Requires the RELEASE_* secrets (see
# store/RELEASE_SIGNING.md) to be set on the repository first.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore.jks

      - name: Build signed release AAB and APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore.jks

      - name: Upload release AAB (for Play Console upload)
        uses: actions/upload-artifact@v4
        with:
          name: diem_geo-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload signed release APK (for direct install/testing)
        uses: actions/upload-artifact@v4
        with:
          name: diem_geo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
